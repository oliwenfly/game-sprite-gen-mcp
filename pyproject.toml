[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-sprite-gen-mcp"
version = "0.1.0"
description = "Generate sprite-sheet animations through any OpenAI-compatible image API, with background removal, quality checks and retries. Ships an MCP server and a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "<YOUR NAME>" }]
keywords = ["mcp", "sprite-sheet", "animation", "pixel-art", "gamedev", "image-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0",
    "httpx>=0.27",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spritegen = "spritegen.cli:main"
spritegen-mcp = "spritegen.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spritegen"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
